name: Build unsigned IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: |
          python3 Scripts/fetch_voice_models.py
          xcodegen generate
      - name: Check spoken route commands
        run: |
          mkdir -p build
          swiftc Sources/RouteModel.swift Sources/CommandParser.swift Sources/UtteranceSegmenter.swift Tests/main.swift -o build/parser-check
          ./build/parser-check
      - name: Check real local Russian transcription
        run: |
          ln -s "$PWD/Sources/AudioConversion.swift" VoiceCheck/Sources/AudioConversion.swift
          ln -s "$PWD/Sources/UtteranceSegmenter.swift" VoiceCheck/Sources/UtteranceSegmenter.swift
          swift run -c release --package-path VoiceCheck VoiceCheck "$PWD/VoiceModels" "$PWD/Tests/voice-command.wav" "$PWD/build/transcript.txt"
          ./build/parser-check build/transcript.txt
      - name: Archive iPhone app
        run: |
          xcodebuild archive -project DiggerMap.xcodeproj -scheme DiggerMap \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/DiggerMap.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Package IPA for Sideloadly
        run: |
          mkdir -p build/Payload
          cp -R build/DiggerMap.xcarchive/Products/Applications/DiggerMap.app build/Payload/
          cd build
          zip -qr DiggerMap-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: DiggerMap-unsigned-ipa
          path: build/DiggerMap-unsigned.ipa
      - name: Preview iPhone 16 Pro Max layout
        run: |
          xcodebuild build -project DiggerMap.xcodeproj -scheme DiggerMap -configuration Debug -sdk iphonesimulator -derivedDataPath build/Simulator CODE_SIGNING_ALLOWED=NO
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if x["name"]=="iPhone 16 Pro Max"))')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build/Simulator/Build/Products/Debug-iphonesimulator/DiggerMap.app
          SIMCTL_CHILD_DIGGERMAP_DEMO=1 xcrun simctl launch "$DEVICE" app.diggermap.route
          sleep 4
          xcrun simctl io "$DEVICE" screenshot build/iPhone16ProMax.png
      - uses: actions/upload-artifact@v4
        with:
          name: iPhone16ProMax-preview
          path: build/iPhone16ProMax.png
