name: DiggerMap
options:
  bundleIdPrefix: app.diggermap
  deploymentTarget:
    iOS: "17.0"
packages:
  WhisperBinary:
    path: Vendor/WhisperBinary
targets:
  DiggerMap:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: VoiceModels
        type: folder
        buildPhase: resources
    dependencies:
      - package: WhisperBinary
        product: WhisperBinary
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: DiggerMap
        CFBundleShortVersionString: "1.4"
        CFBundleVersion: "5"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSMicrophoneUsageDescription: "Микрофон нужен для голосовых команд."
        NSCameraUsageDescription: "Камера нужна для фотографий, прикреплённых к меткам маршрута."
        NSMotionUsageDescription: "Барометр используется для оценки изменения высоты."
        UIBackgroundModes: [audio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.diggermap.route
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.4"
        CURRENT_PROJECT_VERSION: "5"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
