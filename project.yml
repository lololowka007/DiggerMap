name: DiggerMap
options:
  bundleIdPrefix: app.diggermap
  deploymentTarget:
    iOS: "17.0"
targets:
  DiggerMap:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: DiggerMap
        CFBundleShortVersionString: "1.1"
        CFBundleVersion: "2"
        NSSpeechRecognitionUsageDescription: "Распознавание голосовых команд маршрута на устройстве."
        NSMicrophoneUsageDescription: "Микрофон нужен для голосовых команд."
        NSMotionUsageDescription: "Барометр используется для оценки изменения высоты."
        UIBackgroundModes: [audio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.diggermap.route
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "2"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
